name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against Cargo version
        id: version
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Extract changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" version "]") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      PACKAGE: rvc-rs-${{ needs.notes.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libxkbcommon-dev pkg-config
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p rvc-rs-cli -p rvc-rs-inference
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:PACKAGE | Out-Null
          Copy-Item target/${{ matrix.target }}/release/rvc-rs.exe, target/${{ matrix.target }}/release/rvc-rs-inference.exe $env:PACKAGE
          Copy-Item README.md, CHANGELOG.md, LICENSE, NOTICE, THIRD_PARTY_NOTICES.md $env:PACKAGE
          Compress-Archive -Path $env:PACKAGE -DestinationPath "$env:PACKAGE.zip"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir "$PACKAGE"
          cp target/${{ matrix.target }}/release/rvc-rs target/${{ matrix.target }}/release/rvc-rs-inference "$PACKAGE"
          cp README.md CHANGELOG.md LICENSE NOTICE THIRD_PARTY_NOTICES.md "$PACKAGE"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [notes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notes.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "rvc-rs $VERSION" \
            --notes-file artifacts/notes/notes.md \
            artifacts/rvc-rs-*/*
